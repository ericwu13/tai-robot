name: Auto-merge gate

# Public-repo workflow. pull_request_target and workflow_run run this file
# from master and can see secrets. pull_request_review runs the PR merge
# ref, so every job:
#   - checks out master only (sparse scripts/ci), never the PR head
#   - passes inputs through env, never inside run:
#   - re-reads the live pull request in scripts/ci/auto_merge_gate.py and
#     ignores a fork. trigger-sage, retrigger-reed, and eval-approval-gate
#     also require an open PR into master.
# trigger-sage, retrigger-reed, and notify-selina are read-only and each
# receives only its own webhook secrets. retrigger-reed posts once: the
# later of Tests and Claude Review, or a cursor[bot] WAIT after CI is
# green. eval-approval-gate can write the status, resolve a bot thread,
# and enable auto-merge. Merges use a GitHub App token when
# AUTOMERGE_APP_ID is set and the proof step succeeds, so they fire
# workflows and delete the head branch. Otherwise the gate keeps using
# github.token. The App token is MERGE_GH_TOKEN only; GH_TOKEN stays
# github.token. The proof step never prints the token.

on:
  pull_request_target:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, labeled, unlabeled, closed]
  pull_request_review:
    types: [submitted, dismissed]
  workflow_run:
    workflows: ["Tests", "Claude Review"]
    types: [completed]

jobs:
  trigger-sage:
    if: >-
      github.event_name == 'pull_request_target' &&
      (github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.action == 'reopened' || github.event.action == 'ready_for_review') &&
      !github.event.pull_request.draft &&
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'master'
    concurrency:
      group: trigger-sage-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          sparse-checkout: scripts/ci
          persist-credentials: false
      - name: Trigger Sage
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SAGE_REVIEW_WEBHOOK_URL: ${{ secrets.SAGE_REVIEW_WEBHOOK_URL }}
          SAGE_REVIEW_WEBHOOK_KEY: ${{ secrets.SAGE_REVIEW_WEBHOOK_KEY }}
        run: python3 scripts/ci/auto_merge_gate.py trigger-sage

  eval-approval-gate:
    if: >-
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'master' &&
      (
        (
          github.event_name == 'pull_request_target' &&
          (
            (github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
            github.event.label.name == 'needs-owner'
          )
        ) ||
        (
          github.event_name == 'pull_request_review' &&
          github.event.review.user.login == 'cursor[bot]'
        )
      )
    concurrency:
      group: auto-merge-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    env:
      AUTOMERGE_APP_ID: ${{ secrets.AUTOMERGE_APP_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          sparse-checkout: scripts/ci
          persist-credentials: false
      # GITHUB_TOKEN merges do not start workflows. Mint a repo-scoped App
      # token only when the secret is set. A mint or proof failure falls
      # back to github.token instead of blocking the gate.
      - name: Create auto-merge token
        id: automerge-token
        if: env.AUTOMERGE_APP_ID != ''
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.AUTOMERGE_APP_ID }}
          private-key: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-metadata: read
          permission-pull-requests: write
      - name: Prove auto-merge token
        id: prove-automerge-token
        if: ${{ steps.automerge-token.outcome == 'success' && steps.automerge-token.outputs.token != '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.automerge-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          kind=github.token
          finish() {
            if [ "$kind" = app ]; then
              echo "merge token: app"
            else
              echo "merge token: github.token"
            fi
          }
          trap finish EXIT
          names="$(gh api --paginate /installation/repositories --jq '.repositories[].full_name')"
          printf '%s\n' "$names"
          if printf '%s\n' "$names" | grep -Fxq "$REPO"; then
            echo "repo listed: yes"
          else
            echo "repo listed: no"
            exit 1
          fi
          perms="$(gh api --paginate /installation/repositories --jq '.repositories[] | select(.full_name == env.REPO) | .permissions' || true)"
          if [ -n "$perms" ] && [ "$perms" != "null" ]; then
            echo "token permissions: $perms"
          else
            echo "token permissions: not returned"
          fi
          kind=app
      - name: Run approval gate
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_GH_TOKEN: ${{ steps.prove-automerge-token.outcome == 'success' && steps.automerge-token.outputs.token || github.token }}
          MERGE_TOKEN_KIND: ${{ steps.prove-automerge-token.outcome == 'success' && 'app' || 'github.token' }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          echo "merge token: $MERGE_TOKEN_KIND"
          python3 scripts/ci/auto_merge_gate.py gate

  retrigger-reed:
    if: >-
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      ) ||
      (
        github.event_name == 'pull_request_review' &&
        github.event.action == 'submitted' &&
        github.event.review.user.login == 'cursor[bot]' &&
        github.event.pull_request.state == 'open' &&
        github.event.pull_request.head.repo.full_name == github.repository
      )
    concurrency:
      group: retrigger-reed-${{ github.event.workflow_run.head_sha || github.event.pull_request.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      checks: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          sparse-checkout: scripts/ci
          persist-credentials: false
      - name: Retrigger Reed
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          REED_QA_WEBHOOK_URL: ${{ secrets.REED_QA_WEBHOOK_URL }}
          REED_QA_WEBHOOK_KEY: ${{ secrets.REED_QA_WEBHOOK_KEY }}
        run: python3 scripts/ci/auto_merge_gate.py retrigger-reed

  notify-selina:
    if: >-
      (
        github.event_name == 'pull_request_review' &&
        github.event.action == 'submitted' &&
        github.event.review.user.login == 'cursor[bot]' &&
        github.event.pull_request.state == 'open' &&
        github.event.pull_request.head.repo.full_name == github.repository
      ) ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        (
          github.event.workflow_run.conclusion == 'failure' ||
          (
            github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.name == 'Claude Review'
          )
        )
      ) ||
      (
        github.event_name == 'pull_request_target' &&
        github.event.action == 'closed' &&
        github.event.pull_request.merged == true &&
        github.event.pull_request.head.repo.full_name == github.repository
      )
    concurrency:
      group: notify-selina-${{ github.event_name }}-${{ github.event.review.id || github.event.pull_request.number || github.event.workflow_run.head_sha }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      checks: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          sparse-checkout: scripts/ci
          persist-credentials: false
      - name: Notify Selina
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          REVIEW_ID: ${{ github.event.review.id }}
          REVIEW_STATE: ${{ github.event.review.state }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          MERGED_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          SELINA_QA_WEBHOOK_URL: ${{ secrets.SELINA_QA_WEBHOOK_URL }}
          SELINA_QA_WEBHOOK_KEY: ${{ secrets.SELINA_QA_WEBHOOK_KEY }}
        run: python3 scripts/ci/auto_merge_gate.py notify-selina
