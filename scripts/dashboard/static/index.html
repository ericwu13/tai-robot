<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>機器人監控</title>
<style>
:root {
  --bg: #f5f6f8; --panel: #ffffff; --line: #e3e6eb; --text: #1c2330; --muted: #6b7484;
  --up: #d23c3c; --down: #1f9d55;              /* 紅漲綠跌 */
  --ok: #2b6fd6; --ok-bg: #e7effc;
  --warn: #b86e00; --warn-bg: #fff3dc;
  --bad: #c2410c; --bad-bg: #ffe8dc;
  --off: #8a93a3; --off-bg: #eef0f3;
  --row-hover: #f0f4fb;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1319; --panel: #171c24; --line: #262d38; --text: #e3e7ee; --muted: #8d97a8;
    --up: #f06464; --down: #3fbf74;
    --ok: #6ea2ff; --ok-bg: #1a2a45;
    --warn: #f0b04a; --warn-bg: #3a2c12;
    --bad: #ff8a5b; --bad-bg: #42221a;
    --off: #7c8596; --off-bg: #222833;
    --row-hover: #1d2430;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.5 "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", system-ui, sans-serif; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px;
  padding: 12px 16px; background: var(--panel); border-bottom: 1px solid var(--line);
  position: sticky; top: 0; z-index: 5; }
h1 { font-size: 18px; margin: 0; font-weight: 700; }
.host { color: var(--muted); }
.spacer { flex: 1; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px;
  border-radius: 999px; font-size: 13px; white-space: nowrap; }
.chip::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.s-ok { color: var(--ok); background: var(--ok-bg); }
.s-warn { color: var(--warn); background: var(--warn-bg); }
.s-bad { color: var(--bad); background: var(--bad-bg); font-weight: 700; }
.s-off { color: var(--off); background: var(--off-bg); }
.updated { color: var(--muted); font-size: 13px; }
.updated.stale { color: var(--bad); font-weight: 700; }
main { padding: 16px; max-width: 1400px; margin: 0 auto; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.tile .k { color: var(--muted); font-size: 13px; }
.tile .v { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin: 0 0 10px; }
.toolbar label { color: var(--muted); font-size: 13px; display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 9px 10px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { color: var(--muted); font-weight: 600; font-size: 13px; background: var(--panel); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
tbody tr:last-child td { border-bottom: 0; }
#fleet tbody tr { cursor: pointer; }
#fleet tbody tr:hover { background: var(--row-hover); }
.scroll-x { overflow-x: auto; }
.alert { color: var(--bad); }
.up { color: var(--up); } .down { color: var(--down); } .muted { color: var(--muted); }
.name { font-weight: 700; }
.sub { color: var(--muted); font-size: 12px; }
.trunc { max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
.empty { padding: 24px; text-align: center; color: var(--muted); }
.banner { display: none; margin-bottom: 12px; padding: 10px 14px; border-radius: 8px;
  background: var(--bad-bg); color: var(--bad); font-weight: 700; }
.banner.show { display: block; }
.controls { display: inline-flex; gap: 8px; margin-left: auto; }
button.danger { color: #fff; background: var(--bad); border-color: var(--bad); font-weight: 700; }
button.danger:disabled, button.primary:disabled { opacity: .45; cursor: not-allowed; }
button.primary { color: #fff; background: var(--ok); border-color: var(--ok); font-weight: 700; }
.pend { display: inline-block; margin-left: 6px; padding: 1px 8px; border-radius: 6px; font-size: 12px;
  color: var(--warn); background: var(--warn-bg); font-weight: 700; white-space: nowrap; }
dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--text);
  padding: 0; width: min(440px, calc(100vw - 32px)); }
dialog::backdrop { background: rgba(0,0,0,.45); }
.dlg { padding: 18px 20px; display: grid; gap: 12px; }
.dlg h3 { margin: 0; font-size: 17px; }
.dlg p { margin: 0; }
.dlg .warn { color: var(--bad); font-weight: 700; }
.dlg input { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line);
  border-radius: 8px; padding: 6px 10px; }
.dlg .row { display: flex; gap: 8px; justify-content: flex-end; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 20;
  padding: 10px 16px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line);
  box-shadow: 0 6px 24px rgba(0,0,0,.25); max-width: calc(100vw - 32px); }
.toast.bad { color: var(--bad); font-weight: 700; }
button, select { font: inherit; color: var(--text); background: var(--panel);
  border: 1px solid var(--line); border-radius: 8px; padding: 5px 12px; cursor: pointer; }
button:hover, select:hover { border-color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--ok-bg); color: var(--ok); font-weight: 700; }
.detail-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin-bottom: 12px; }
.detail-head h2 { margin: 0; font-size: 20px; }
.chart { height: 380px; }
.chart.small { height: 160px; }
.section-title { font-weight: 700; padding: 10px 14px; border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.grid2 { display: grid; gap: 16px; margin-top: 16px; }
.tabs { display: flex; gap: 4px; padding: 8px 10px 0; border-bottom: 1px solid var(--line); }
.tabs button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none; padding: 6px 12px; color: var(--muted); }
.tabs button.on { color: var(--text); border-bottom-color: var(--ok); font-weight: 700; }
.scroll { overflow: auto; max-height: 520px; }
pre.log { margin: 0; padding: 10px 14px; font: 12px/1.55 Consolas, "Cascadia Mono", monospace; white-space: pre-wrap; word-break: break-all; }
pre.log .P1 { color: var(--bad); font-weight: 700; }
pre.log .P2 { color: var(--warn); }
pre.log .P3 { color: var(--muted); }
.legend { color: var(--muted); font-size: 12px; font-weight: 400; }
.rg { display: inline-block; padding: 1px 8px; border-radius: 6px; font-size: 13px; font-weight: 700; white-space: nowrap; }
.rg.up { color: #fff; background: var(--up); }
.rg.down { color: #fff; background: var(--down); }
.rg.range { color: var(--ok); background: var(--ok-bg); }
.rg.trans { color: var(--warn); background: var(--warn-bg); }
.rg.none { color: var(--off); background: var(--off-bg); }
.rg-line { display: flex; gap: 6px; align-items: center; margin-top: 3px; font-size: 12px; color: var(--muted); }
.regime-body { padding: 12px 14px; display: grid; gap: 12px; }
.regime-body .tiles { margin: 0; }
.regime-body .tile .v { font-size: 17px; }
.feat { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--muted); }
.feat b { color: var(--text); font-variant-numeric: tabular-nums; font-weight: 600; }
.flags { display: grid; gap: 6px; }
.flag { display: flex; gap: 8px; align-items: baseline; font-size: 13px; }
.sev { font-size: 12px; font-weight: 700; padding: 0 6px; border-radius: 5px; }
.sev.P1 { color: #fff; background: var(--bad); }
.sev.P2 { color: var(--warn); background: var(--warn-bg); }
.sev.P3 { color: var(--off); background: var(--off-bg); }
.scroll.short { max-height: 280px; }
.votes { display: grid; gap: 8px; }
.votes .head { font-size: 13px; color: var(--muted); }
.vote-row { display: grid; grid-template-columns: minmax(150px, 1.2fr) minmax(110px, .8fr) 2fr auto; gap: 8px 14px; align-items: center; font-size: 13px; }
.vote-row .dot { display: inline-flex; align-items: center; gap: 6px; }
.vote-row .dot::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.vote-row .ok { color: var(--ok); } .vote-row .stale { color: var(--warn); } .vote-row .off { color: var(--off); }
.breaker { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; font-size: 13px; }
@media (max-width: 760px) { .vote-row { grid-template-columns: 1fr 1fr; } }
.mode { font-size: 13px; color: var(--muted); }
.mode.real { color: #fff; background: var(--bad); padding: 1px 8px; border-radius: 6px; font-weight: 700; }
[hidden] { display: none !important; }

/* Phone: the fleet table becomes one card per bot, no sideways scroll. */
@media (max-width: 760px) {
  main { padding: 12px 16px; }
  #fleet thead { display: none; }
  #fleet, #fleet tbody, #fleet tr, #fleet td { display: block; width: 100%; }
  #fleet tr { border-bottom: 1px solid var(--line); padding: 8px 4px; }
  #fleet td { border: 0; padding: 3px 10px; white-space: normal; text-align: left; display: flex; justify-content: space-between; gap: 12px; }
  #fleet td::before { content: attr(data-label); color: var(--muted); font-size: 13px; }
  #fleet td.first::before { content: none; }
  .trunc { max-width: none; }
  .chart { height: 300px; }
  .scroll.wide { overflow-x: auto; }
}
</style>
</head>
<body>
<header>
  <h1>機器人監控</h1>
  <span class="host" id="host"></span>
  <span class="chip s-off" id="market">讀取中…</span>
  <span class="spacer"></span>
  <span class="updated" id="updated"></span>
</header>
<main>
  <div class="banner" id="banner">無法連線到監控伺服器，畫面上的資料可能已過時。</div>

  <section id="fleet-view">
    <div class="tiles" id="tiles"></div>
    <div class="toolbar">
      <label><input type="checkbox" id="show-retired"> 顯示已停用的機器人</label>
      <span class="legend">點選任一列查看圖表、交易與日誌。損益顏色：紅＝獲利、綠＝虧損。</span>
    </div>
    <div class="panel scroll-x">
      <table id="fleet">
        <thead><tr>
          <th>狀態</th><th>機器人</th><th>模式</th><th>持倉</th>
          <th class="num">未實現</th><th class="num" title="自最近一次夜盤開盤（15:00）起">本交易日</th><th class="num" title="模擬成交價計算">模擬累計</th><th class="num" title="實際成交價計算，未扣手續費及期交稅">實單累計</th>
          <th class="num">交易數</th><th class="num">勝率</th><th>最後決策</th><th>心跳</th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <section id="detail-view" hidden>
    <div class="detail-head">
      <button id="back">← 返回總覽</button>
      <h2 id="d-name"></h2>
      <span id="d-state"></span>
      <span id="d-mode"></span>
      <span class="sub" id="d-strategy"></span>
      <span id="d-pending"></span>
      <span class="controls" id="d-controls" hidden>
        <span class="sub" id="d-controls-hint" hidden>GUI 機器人，請在程式中操作</span>
        <button class="primary" id="btn-paper">改為模擬</button>
        <button class="danger" id="btn-stop">停止機器人</button>
      </span>
    </div>
    <div class="tiles" id="d-tiles"></div>
    <div class="panel" id="d-regime" hidden style="margin-bottom:16px">
      <div class="section-title"><span>盤勢切換</span><span class="legend" id="d-regime-note"></span></div>
      <div class="regime-body" id="d-regime-body"></div>
    </div>
    <div class="panel">
      <div class="section-title">
        <span>K 線</span>
        <span class="seg" id="d-iv">
          <button data-iv="60">1分</button><button data-iv="300">5分</button>
          <button data-iv="900">15分</button><button data-iv="3600">60分</button>
        </span>
        <span class="legend">▲ 進場　▼ 出場（時間為台北時間）　往左拖曳載入更早的 K 線</span>
        <span class="legend" id="d-band-legend" hidden>底部色帶＝盤勢：<span class="rg up">趨勢向上</span> <span class="rg down">趨勢向下</span> <span class="rg range">盤整</span> <span class="rg trans">轉換中</span></span>
        <span class="legend" id="d-loading" hidden>載入中…</span>
      </div>
      <div class="chart" id="d-chart"></div>
      <div class="empty" id="d-chart-empty" hidden>沒有 K 線資料</div>
    </div>
    <div class="grid2">
      <div class="panel">
        <div class="section-title">累計已實現損益</div>
        <div class="chart small" id="d-equity"></div>
        <div class="empty" id="d-equity-empty" hidden>尚無已平倉交易</div>
      </div>
      <div class="panel">
        <div class="tabs" id="d-tabs">
          <button data-tab="trades" class="on">交易紀錄</button>
          <button data-tab="decisions">決策紀錄</button>
          <button data-tab="log">日誌</button>
        </div>
        <div class="scroll wide" data-pane="trades"><table id="d-trades"><thead><tr>
          <th>方向</th><th>進場時間</th><th class="num">進場價</th><th>出場時間</th>
          <th class="num">出場價</th><th class="num">模擬損益</th><th class="num">實單損益</th><th>出場原因</th><th>來源</th>
        </tr></thead><tbody></tbody></table></div>
        <div class="scroll wide" data-pane="decisions" hidden><table id="d-decisions"><thead><tr>
          <th>K 線時間</th><th>動作</th><th>方向</th><th class="num">價格</th><th>原因</th>
        </tr></thead><tbody></tbody></table></div>
        <div class="scroll" data-pane="log" hidden>
          <div class="section-title"><span class="sub" id="d-logfile"></span>
            <span class="legend">敏感資訊（頻道 ID、帳號）已遮蔽</span></div>
          <pre class="log" id="d-log"></pre>
        </div>
      </div>
    </div>
  </section>
</main>
<dialog id="dlg"><form method="dialog" class="dlg" id="dlg-form">
  <h3 id="dlg-title"></h3>
  <div id="dlg-body"></div>
  <div class="row"><button value="cancel" formnovalidate>取消</button>
    <button id="dlg-ok" value="ok"></button></div>
</form></dialog>
<div class="toast" id="toast" hidden></div>

<script>
// Defined before the tag below: its onerror fires before later scripts parse.
// The local copy 404s where the lightweight_charts package is absent (Steven).
function loadCdnCharts() {
  const s = document.createElement("script");
  // SRI pins the unpkg fallback (sha384 of lightweight-charts 4.1.3 standalone).
  s.crossOrigin = "anonymous";
  s.integrity = "sha384-JZigAjwiaZtkUbA44CWkPaT3iBb/mU5pO6QOANp+OqHd4q+1+7MG1kzp2OOP9ZfP";
  s.src = "https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js";
  s.onload = () => { if (window.App) window.App.onChartsReady(); };
  document.head.appendChild(s);
}
</script>
<script src="/static/lwc.js" onerror="loadCdnCharts()"></script>
<script>
"use strict";

const STATE = {
  RUNNING:      ["運作中", "s-ok"],
  NO_HEARTBEAT: ["無心跳・無法確認", "s-warn"],
  LAGGING:      ["延遲", "s-warn"],
  UNKNOWN:      ["狀態不明", "s-warn"],
  HUNG:         ["⚠ 卡住", "s-bad"],
  CRASHED:      ["⚠ 異常終止", "s-bad"],
  STOPPED:      ["已停止", "s-off"],
};
const STATE_ORDER = ["HUNG", "CRASHED", "NO_HEARTBEAT", "LAGGING", "UNKNOWN", "RUNNING", "STOPPED"];
const MODE = { paper: "模擬", semi_auto: "半自動・實單", auto: "全自動・實單" };
function modeBadge(m) {
  const real = m && m !== "paper";
  return el("span", { class: real ? "mode real" : "mode" }, MODE[m] || m || "—");
}
const SIDE = { LONG: "多", SHORT: "空" };
const ACTION = {
  ENTRY: "進場訊號", ENTRY_FILL: "進場成交", CLOSE: "平倉", TRADE_CLOSE: "出場",
  FORCE_CLOSE: "強制平倉", REAL_EXIT_CONFIRMED: "實單出場確認",
  REAL_ORDER_SKIPPED: "實單略過", REAL_ORDER_TIMEOUT: "實單確認逾時",
  REAL_ORDER_BLOCKED: "實單被擋", SIGNAL_BLOCKED: "訊號被擋", NEWS_SUPPRESSED: "新聞抑制",
};
const EXIT_TAG = { force_close: "強制平倉", session_end: "收盤平倉", stop: "停損", stop_loss: "停損",
  take_profit: "停利", limit: "限價出場", manual: "手動平倉" };
const SOURCE = { paper: "模擬", real: "實單" };
const REGIME = {
  "trending-up": ["趨勢向上", "up"], "trending-down": ["趨勢向下", "down"],
  "range-bound": ["盤整", "range"], "transitional": ["轉換中", "trans"],
};
const RG_ACTION = { hold: "維持", sit_out: "空手觀望", deploy_long: "啟用多方", deploy_short: "啟用空方",
  deploy_long_half: "多方（半倉）", deploy_short_half: "空方（半倉）" };
const LEG = { long: "多方", short: "空方" };
const SLOT = { NIGHT: "夜盤", DAY: "日盤" };
function rgChip(regime) {
  const [label, cls] = REGIME[regime] || [regime || "未判斷", "none"];
  return el("span", { class: "rg " + cls }, label);
}
function sessionKey(key) {   // "2026-10-23|NIGHT" → "2026-10-23 夜盤"
  const [date, slot] = String(key || "").split("|");
  return date ? `${date} ${SLOT[slot] || slot || ""}`.trim() : "—";
}

const $ = (id) => document.getElementById(id);
function el(tag, props, ...kids) {
  const n = document.createElement(tag);
  if (props) for (const [k, v] of Object.entries(props)) {
    if (k === "class") n.className = v; else if (k === "data") Object.assign(n.dataset, v);
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v);
  }
  for (const c of kids) if (c !== null && c !== undefined) n.append(c instanceof Node ? c : String(c));
  return n;
}
const fmtInt = (v) => Number(v).toLocaleString("zh-TW");
function money(v) {
  if (v === null || v === undefined) return el("span", { class: "muted" }, "—");
  const cls = v > 0 ? "up" : v < 0 ? "down" : "muted";
  return el("span", { class: cls }, (v > 0 ? "+" : "") + fmtInt(v));
}
function ago(sec) {
  if (sec === null || sec === undefined) return "—";
  sec = Math.max(0, Math.round(sec));
  if (sec < 60) return sec + " 秒前";
  if (sec < 3600) return Math.floor(sec / 60) + " 分鐘前";
  if (sec < 86400) return Math.floor(sec / 3600) + " 小時前";
  return Math.floor(sec / 86400) + " 天前";
}
function chip(state) {
  const [label, cls] = STATE[state] || [state, "s-warn"];
  return el("span", { class: "chip " + cls }, label);
}
function positionText(p) {
  if (!p) return el("span", { class: "muted" }, "空手");
  const price = p.real_entry_price || p.entry_price;
  return el("span", { class: p.side === "LONG" ? "up" : "down" },
    `${SIDE[p.side] || p.side} ${p.size} 口 @ ${fmtInt(price)}`);
}
// 損益 is the broker's simulated P&L, so the row shows the simulated price it
// came from; a confirmed real fill that differs is shown underneath.
function priceCell(sim, real) {
  if (!real || real === sim) return fmtInt(sim);
  return el("span", null, fmtInt(sim), el("div", { class: "sub" }, "實際 " + fmtInt(real)));
}
function pendingChip(p) {
  if (!p) return null;
  if (p.stop) return el("span", { class: "pend" }, "停止中…");
  if (p.mode) return el("span", { class: "pend" }, "待切換" + (MODE[p.mode] || p.mode));
  return null;
}
// Real-order P&L comes from recorded fill prices (scripts/dashboard/real_pnl.py).
// Gross: before broker fees and the futures transaction tax.
function realCell(r) {
  if (!r) return el("span", { class: "muted" }, "—");
  if (!r.trades) return el("span", { class: "muted", title: `${r.unreliable + r.missing} 筆實單價格不可靠或缺失，不計入` }, "無可信資料");
  return el("span", { title: `${r.trades} 筆實單（含估 ${r.estimated}）；滑價 ${r.slippage_total > 0 ? "+" : ""}${fmtInt(r.slippage_total)}` },
    money(r.pnl_total));
}
function realTiles(r) {

    // navigating while it is open must not retarget it, and the server
    // refuses a stop whose position no longer matches the warning shown.
    const botId = b.id;
    const posAck = b.position ? `${b.position.side}:${b.position.size}` : "flat";
    const real = b.trading_mode !== "paper";   // unknown mode counts as real

      body.push(el("p", null, "有持倉、等待成交或重播歷史時，機器人會拒絕切換。"));

    )) : [el("tr", null, el("td", { colspan: "5", class: "empty" }, "尚無決策紀錄"))]));

    $("d-logfile").textContent = d.log_file ? "檔案：" + d.log_file + "（最後 " + d.log.length + " 行）" : "沒有日誌";
    const pre = $("d-log"), atBottom = pre.parentElement.scrollTop + pre.parentElement.clientHeight >= pre.parentElement.scrollHeight - 20;
    pre.replaceChildren(...d.log.map((l) => el("span", { class: l.sev }, l.text + "\n")));
    if (atBottom) pre.parentElement.scrollTop = pre.parentElement.scrollHeight;
  },

  renderRegime(r) {
    $("d-regime").hidden = !r;
    $("d-band-legend").hidden = !r;
    if (!r) return;
    const n = r.next || {};
    const legStrategy = r.active_leg === "long" ? r.long_strategy : r.active_leg === "short" ? r.short_strategy : "";
    const sub = (text) => el("div", { class: "sub" }, text);
    const tiles = el("div", { class: "tiles" },
      tile("目前盤勢", el("div", null, rgChip(r.effective), r.since ? sub("自 " + r.since) : null)),
      tile("執行中", el("div", null, LEG[r.active_leg] || "空手", legStrategy ? sub(legStrategy) : null)),
      tile(`下一盤計畫${n.date ? "（依 " + n.date + " 夜盤判斷）" : ""}`, el("div", null,
        RG_ACTION[n.action] || n.action || "—", n.strategy ? sub(n.strategy) : null,
        sub(n.executed ? "✓ 已套用" + (n.executed_at ? " " + n.executed_at.slice(0, 16) : "") : "尚未套用"))),
      tile("確認進度", el("div", null, rgChip(r.pending_label || r.raw),
        sub(`連續 ${r.pending_count} 夜・最近原始判斷：${(REGIME[r.raw] || [r.raw || "—"])[0]}`))),
      tile("翻轉暫停", r.pause
        ? el("div", null, "⏸ 暫停中", sub(`至第 ${r.pause.until_session} 夜（目前第 ${r.pause.session_count} 夜）`))
        : "無"),
      tile("最近判斷", el("div", null, sessionKey(r.last_assessed),
        r.manual_override && r.manual_override !== "auto" ? sub("手動指定：" + r.manual_override) : null)),
    );
    const f = r.features || {};
    const num = (v, digits) => (typeof v === "number" ? v.toLocaleString("zh-TW", { maximumFractionDigits: digits }) : "—");
    const feat = el("div", { class: "feat" },
      el("span", null, "ADX ", el("b", null, num(f.adx, 1))),
      el("span", null, "+DI ", el("b", null, num(f.plus_di, 1))),
      el("span", null, "−DI ", el("b", null, num(f.minus_di, 1))),
      el("span", null, "ATR 比 ", el("b", null, num(f.atr_ratio, 2))),
      el("span", null, "EMA 斜率 ", el("b", null, num(f.ema_slope, 1))),
      el("span", null, "收盤 / EMA50 ", el("b", null, `${num(f.last_close, 0)} / ${num(f.ema_50, 0)}`)),
      el("span", null, "外部投票 ", el("b", null, r.votes && r.votes.length ? r.votes.join("、") : "無")),
      el("span", null, "新聞 ", el("b", null, r.news_enabled ? "啟用" : "未啟用")),
    );
    const flags = r.flags && r.flags.length
      ? el("div", { class: "flags" }, ...r.flags.map((x) => el("div", { class: "flag" },
          el("span", { class: "sev " + x.sev }, x.sev), el("span", null, x.text))))
      : el("div", { class: "sub" }, "監控檢查：無異常");
    const rows = (r.history || []).map((h) => el("tr", null,
      el("td", null, h.date), el("td", null, SLOT[h.session] || h.session),
      el("td", null, h.effective_regime ? rgChip(h.effective_regime) : "—"),
      el("td", null, (REGIME[h.raw_regime] || [h.raw_regime || "—"])[0]),
      el("td", { class: "num" }, h.confirm_count || "—"),
      el("td", null, RG_ACTION[h.decision] || h.decision || "—"),
      el("td", { class: "trunc", title: h.strategy_active }, h.strategy_active || "—"),
      el("td", null, h.applied === "true" ? "✓" : h.applied === "false" ? "否" : "—"),
      el("td", null, h.votes || "—"),
      el("td", { class: "num" }, money(h.pnl)),
      el("td", { class: "num" }, h.trades || "0")));
    const table = el("div", { class: "scroll short wide" }, el("table", null,
      el("thead", null, el("tr", null, ...["日期", "盤別", "有效盤勢", "原始", "確認", "決策", "執行策略", "已套用", "投票"]
        .map((h) => el("th", null, h)), el("th", { class: "num" }, "損益"), el("th", { class: "num" }, "交易"))),
      el("tbody", null, ...(rows.length ? rows : [el("tr", null, el("td", { colspan: "11", class: "empty" }, "尚無紀錄"))]))));
    $("d-regime-note").textContent = "與每日監控相同的檢查規則";
    $("d-regime-body").replaceChildren(tiles, feat, flags, votesBlock(r.vote_status, r.news_enabled), table);
  },

  css(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); },

  ensureCharts() {
    if (this.chart || !window.LightweightCharts) return !!this.chart;
    const base = () => ({
      layout: { background: { color: this.css("--panel") }, textColor: this.css("--muted"),
        fontFamily: getComputedStyle(document.body).fontFamily },
      grid: { vertLines: { color: this.css("--line") }, horzLines: { color: this.css("--line") } },
      rightPriceScale: { borderColor: this.css("--line") },
      timeScale: { borderColor: this.css("--line"), timeVisible: true, secondsVisible: false },
      localization: { locale: "zh-TW", priceFormatter: (p) => fmtInt(Math.round(p)) },
      autoSize: true,
    });
    this.chart = LightweightCharts.createChart($("d-chart"), base());
    const up = this.css("--up"), down = this.css("--down");
    this.candles = this.chart.addCandlestickSeries({ upColor: up, downColor: down,
      wickUpColor: up, wickDownColor: down, borderVisible: false });
    this.chart.priceScale("right").applyOptions({ scaleMargins: { top: 0.06, bottom: 0.08 } });
    this.band = this.chart.addHistogramSeries({ priceScaleId: "band", lastValueVisible: false,
      priceLineVisible: false, priceFormat: { type: "volume" } });
    this.chart.priceScale("band").applyOptions({ scaleMargins: { top: 0.96, bottom: 0 }, visible: false });
    // Near the left edge, page in older days. lightweight-charts fires this
    // asynchronously, including after the page's own setData; what bounds
    // the chain is that drawCharts shifts the view right by the candles it
    // prepended, so loading stops once the visible range is filled.
    this.chart.timeScale().subscribeVisibleLogicalRangeChange((range) => {
      if (range && range.from < 40) this.loadBars("older");
    });
    this.equityChart = LightweightCharts.createChart($("d-equity"), base());
    this.equity = this.equityChart.addBaselineSeries({ baseValue: { type: "price", price: 0 },
      topLineColor: up, bottomLineColor: down,
      topFillColor1: "transparent", topFillColor2: "transparent",
      bottomFillColor1: "transparent", bottomFillColor2: "transparent", lineWidth: 2 });
    return true;
  },

  onChartsReady() { if (this.detail) { this.drawCharts(); this.drawEquity(); } },

  rgba(hex, a) {
    const m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(hex);
    return m ? `rgba(${parseInt(m[1], 16)},${parseInt(m[2], 16)},${parseInt(m[3], 16)},${a})` : hex;
  },

  bandData(bars) {
    const band = (this.detail && this.detail.regime && this.detail.regime.band) || [];
    if (!band.length) return [];
    const color = { up: this.css("--up"), down: this.css("--down"), range: this.css("--ok"), trans: this.css("--warn") };
    const out = [];
    let i = -1;
    for (const b of bars) {
      while (i + 1 < band.length && band[i + 1].time <= b.time) i++;
      if (i < 0) continue;
      const cls = (REGIME[band[i].regime] || [null, "none"])[1];
      out.push({ time: b.time, value: 1, color: this.rgba(color[cls] || this.css("--off"), 0.7) });
    }
    return out;
  },

  aggregate(bars, iv) {
    if (iv === 60) return bars;
    const out = [];
    let cur = null;
    for (const b of bars) {
      // Buckets start at the session open (08:45 day, 15:00 night), like BarAggregator.
      const mod = ((b.time % 86400) + 86400) % 86400;
      const nightEarly = mod < 5 * 3600;
      const anchor = b.time - mod + (mod >= 15 * 3600 ? 15 * 3600 : nightEarly ? -9 * 3600 : 8 * 3600 + 45 * 60);
      const t = anchor + Math.floor((b.time - anchor) / iv) * iv;
      if (!cur || cur.time !== t) {
        if (cur) out.push(cur);
        cur = { time: t, open: b.open, high: b.high, low: b.low, close: b.close };
      } else {
        cur.high = Math.max(cur.high, b.high); cur.low = Math.min(cur.low, b.low); cur.close = b.close;
      }
    }
    if (cur) out.push(cur);
    return out;
  },

  drawCharts(keepView) {
    if (!this.ensureCharts()) return;
    const bars = this.aggregate(this.bars, this.iv);
    $("d-chart-empty").hidden = bars.length > 0 || !this.barsLoaded;
    $("d-chart").hidden = bars.length === 0;
    // Prepending older days must not move what the viewer is looking at:
    // shift the logical range by the number of candles added in front.
    const ts = this.chart.timeScale();
    const view = keepView ? ts.getVisibleLogicalRange() : null;
    const added = view ? bars.length - (this.drawnCount || 0) : 0;
    this.candles.setData(bars);
    this.drawnCount = bars.length;
    this.band.setData(this.bandData(bars));
    const snap = (t) => {   // a marker must sit on an existing candle
      let lo = 0, hi = bars.length - 1, best = bars.length ? bars[0].time : t;
      while (lo <= hi) { const mid = (lo + hi) >> 1; if (bars[mid].time <= t) { best = bars[mid].time; lo = mid + 1; } else hi = mid - 1; }
      return best;
    };
    const up = this.css("--up"), down = this.css("--down");
    this.candles.setMarkers(this.markers.map((m) => m.kind === "entry"
      ? { time: snap(m.time), position: m.long ? "belowBar" : "aboveBar", shape: m.long ? "arrowUp" : "arrowDown",
          color: m.long ? up : down, text: (m.long ? "多 " : "空 ") + fmtInt(m.price) }
      : { time: snap(m.time), position: m.long ? "aboveBar" : "belowBar", shape: m.long ? "arrowDown" : "arrowUp",
          color: this.css("--muted"), text: "出 " + (m.pnl > 0 ? "+" : "") + fmtInt(m.pnl) }));
    if (view) ts.setVisibleLogicalRange({ from: view.from + added, to: view.to + added });
    else if (this.fitNext && bars.length) { this.showRecent(bars); this.fitNext = false; }
  },

  // Open on roughly the latest trading day; older ones are a drag away.
  showRecent(bars) {
    const span = { 60: 300, 300: 200, 900: 96, 3600: 40 }[this.iv] || 100;
    const last = bars.length - 1;
    this.chart.timeScale().setVisibleLogicalRange({ from: Math.max(0, last - span), to: last + 3 });
  },

  drawEquity() {
    const d = this.detail;
    if (!d || !this.ensureCharts()) return;
    $("d-equity-empty").hidden = d.equity.length > 0;
    $("d-equity").hidden = d.equity.length === 0;
    this.equity.setData(d.equity);
    if (!this.equityFitted) { this.equityChart.timeScale().fitContent(); this.equityFitted = true; }
  },

  init() {
    try { $("show-retired").checked = localStorage.getItem("showRetired") === "1"; } catch (e) {}
    $("show-retired").addEventListener("change", (e) => {
      try { localStorage.setItem("showRetired", e.target.checked ? "1" : "0"); } catch (err) {}
      this.renderFleet();
    });
    $("back").addEventListener("click", () => { location.hash = ""; });
    $("btn-stop").addEventListener("click", () => this.confirmControl("stop"));
    $("btn-paper").addEventListener("click", () => this.confirmControl("paper"));
    for (const btn of $("d-iv").children) btn.addEventListener("click", () => {
      this.iv = Number(btn.dataset.iv); this.fitNext = true;
      for (const b of $("d-iv").children) b.classList.toggle("on", b === btn);
      this.drawCharts();
    });
    for (const btn of $("d-tabs").children) btn.addEventListener("click", () => {
      for (const b of $("d-tabs").children) b.classList.toggle("on", b === btn);
      for (const p of document.querySelectorAll("[data-pane]")) p.hidden = p.dataset.pane !== btn.dataset.tab;
    });
    window.addEventListener("hashchange", () => this.route());
    this.refreshFleet().then(() => this.route());
    setInterval(() => this.refreshFleet(), 5000);
    setInterval(() => this.refreshDetail(), 10000);
    setInterval(() => this.renderUpdated(), 1000);
  },
};
window.App = App;
App.init();
</script>
</body>
</html>
