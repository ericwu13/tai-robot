# tai-robot configuration
# Copy this file to settings.yaml and fill in your values.
# settings.yaml is gitignored to protect credentials.

credentials:
  user_id: "USER_ID"
  # Password is read from env var CAPITAL_API_PASSWORD or Windows keyring.
  # To store in keyring: python -c "import keyring; keyring.set_password('tai-robot', 'YOUR_USER_ID', 'YOUR_PASSWORD')"
  authority_flag: 0          # 0=production, 1=test+production, 2=test only

account:
  # Leave empty to auto-detect from login response
  branch: ""
  account: ""

trading:
  mode: "paper"              # paper | semi_auto | full_auto
  symbol: "TXFD0"            # "TXFD0" for 大台指 (TXF, pv=200), "MTXFD0" for 小台指 (MTX, pv=50)
  market_no: 2               # 2=T-session futures, 7=full-session futures
  default_qty: 1
  order_type: "2"            # "2"=auto new/close
  trade_type: 0              # 0=ROD, 1=IOC, 2=FOK
  price_flag: 0              # 0=market, 1=limit
  allow_live_override: false  # true = allow mode_override.json to switch to "auto" at runtime

strategy:
  name: "ma_crossover"
  params:
    fast_period: 5
    slow_period: 20
  bar_interval: 60           # seconds

risk:
  max_position: 2            # max contracts held
  max_daily_loss: 20000      # TWD
  max_drawdown_pct: 5.0      # percent of starting equity
  order_rate_limit: 10       # max orders per minute

logging:
  level: "INFO"
  log_dir: "logs"
  trade_csv: "logs/trades.csv"

notifications:
  discord_bot_token: ""          # Discord bot token for live trading alerts
  discord_channel_id: ""         # Discord channel ID to send notifications to
  # Optional dedicated channels. Leave empty to send everything to
  # discord_channel_id above.
  discord_evolution_channel_id: ""    # 🧬 evolution logs (verdict / improvement / status)
  discord_daily_report_channel_id: "" # 📊 daily transaction report
  discord_regime_channel_id: ""      # 🔄 regime classification & strategy swap
  discord_poster_channel_id: ""      # 🚀 release announcements (poster channel)
  discord_poster_role_id: ""         # role to tag in release announcements

ai:
  provider: "anthropic"          # "anthropic" or "google"
  anthropic_api_key: ""          # sk-ant-... (from console.anthropic.com)
  google_api_key: ""             # AIza... (from aistudio.google.com/apikey)
  model: ""                      # leave empty for default (Sonnet 4 / Gemini 2.5 Pro)
  max_tokens: 4096
  # Skip the post-load context recap when the loaded conversation already has
  # more than this many messages.  A recap re-sends the full history; on long
  # sessions that's expensive and rarely worth it.
  recap_token_gate: 30
  # When true, "heavy" tier calls (codegen, trade review, pine export) use the
  # most capable model (gemini-3.1-pro-preview) instead of gemini-2.5-pro.
  # Costs more. Env var ULTRA_MODE=1 overrides this at runtime. If Google
  # renames/retires the preview model (404), calls fall back to the default.
  ultra_mode: false

evolution:
  # When the automatic fitness/improvement check runs:
  #   "weekly" (default) — only on the trading week's LAST session, i.e. the
  #     Friday night session that closes Saturday ~05:00 TPE. Daily sessions
  #     rarely cross the 30-trade minimum, so daily scoring is gated noise.
  #   "daily" — every session end (the pre-2.12 behavior).
  # The 🧬 Bot Evolution button generates an AI improvement plan on demand
  # regardless of this setting.
  cadence: "weekly"
  # true (default): 🧬 runs the full auto-pipeline — plan → candidate codegen
  # → A/B validation backtest → verdict; a PASS auto-saves the candidate to
  # the strategy store (deployment stays manual). false: plan-only.
  # Also enables the WEEKLY automatic run: fires once per week AFTER the
  # Saturday close (≥ 05:05 TPE, market quiet, week's data complete), with
  # the verdict sent to Discord.
  auto_pipeline: true
  # Validation method for the auto-pipeline:
  #   "deep" (default) — SEE-spec walk-forward: 90d train / 90d test
  #     (out-of-sample decides the verdict) + Monte Carlo robustness
  #     (±10% param jitter; fragile candidates fail). Validation data is
  #     fetched via the Capital API when connected (~194 days); otherwise
  #     local data is used and the windows scale down to the available span.
  #   "simple" — single-window A/B on whatever data is at hand.
  validation: "deep"
  # Walk-forward holdout: the most recent N days of trade evidence are
  # WITHHELD from the AI when it designs the change ("train" = older data
  # only) and the verdict is decided on this unseen window ("test"). The
  # cut rolls forward each cycle — this week's holdout becomes next week's
  # design data.
  holdout_days: 14

# ── News / event framework ─────────────────────────────────────────────
# Scheduled-event calendar + circuit-breaker signal, both written as JSON
# by an external n8n workflow. Leave the paths empty to keep the feature
# off; the bot treats every file as untrusted and fails open on any parse
# problem, so a broken automation can never halt trading indefinitely.
#
# ENABLEMENT IS PER-BOT, not global. `enabled` and `tier2_enabled` below
# are only the deploy dialog's REMEMBERED DEFAULTS — the checkboxes in
# 「多空切換 Regime Switching」decide whether THIS bot gets the breaker,
# and a resumed bot's own session.json overrides these defaults. That is
# what lets a news-enabled bot run beside an untouched baseline bot
# without one risk_off flattening both.
# The paths / max_signal_age_sec / calendar_min_severity below ARE shared
# by every news-enabled bot (they describe the n8n files themselves).
news:
  enabled: false             # dialog default only — per-bot checkbox decides
  signal_path: ""            # circuit-breaker signal JSON (risk_off / deploy_* / clear)
  events_path: ""            # scheduled-event calendar JSON (CPI, FOMC, ...)
  ledger_path: ""            # consumed signal_id ledger — gives exactly-once acting
  regime_vote_path: ""       # regime-vote sidecar JSON — cross-market confirmation acceleration
  max_signal_age_sec: 900    # reject signals older than this (15 min)
  tier2_enabled: false       # dialog default only — per-bot checkbox decides
                             # true = allow forced-entry event strategies (deploy_short/long)
  calendar_min_severity: "high"   # "high" | "medium" | "low" — minimum severity that gates a session
  suppress_scope: "both"     # "both" | "conflicting_leg" — dialog default only;
                             # the per-bot「方向性暫停 directional」checkbox in the
                             # deploy dialog decides, and a resumed bot's own
                             # session.json overrides this default.
                             # both: any risk_off gates every leg (legacy default)
                             # conflicting_leg: a directional risk_off gates only the
                             #   leg it would hurt — bearish gates long legs, bullish
                             #   gates short legs; a same-direction position is kept
                             #   and keeps its exit management. Signals without a
                             #   "direction" field, and severity "critical", always
                             #   gate both. Suppression auto-expires at the next
                             #   session boundary unless a fresh risk_off refreshes it.
  nightly_vote_max_age_h:    # per-source max vote age (hours) for the NIGHTLY lane
    W2: 4.0                  # W2's edge lives in the ~4h after the fire. The nightly
                             # lane only reads votes at the ~04:58 classification — the
                             # END of the session the vote named — and the leg it swings
                             # goes live at the next 08:45 open, ~20h after a US-session
                             # fire. Over that lag W2 scored 3/10. Older W2 votes are
                             # still consumed (deleted), just not shown to the classifier.
                             # A source not listed here has NO age limit (W3 news and W4
                             # chips are daily-cadence signals — ageing them out would
                             # silence them). An empty mapping {} disables the gate.
  regime_vote_thresholds:    # all-symbols-must-breach thresholds for regime vote
    soxx_pct: 2.5
    tsm_pct: 2.0
    qqq_pct: 2.0
  # W3 RSS+Gemini news scorer
  rss_feeds:
    - "https://search.cnbc.com/rs/search/combinedcms/view.xml?partnerId=wrss01&id=100003114"
    - "https://feeds.bloomberg.com/markets/news.rss"
    - "https://feeds.marketwatch.com/marketwatch/topstories"
    - "https://finance.yahoo.com/news/rssindex"
    - "https://www.investing.com/rss/news.rss"
  rss_interval_minutes: 30
  rss_state_file: "data/rss_scorer_state.json"
  discord_webhook: ""             # Discord webhook URL for W2/W3 bridge alerts

# ── Regime switching ───────────────────────────────────────────────────
# Strategy pair and ADX-based classification thresholds for the regime
# switching bot. Thresholds default to the RegimeConfig dataclass values;
# override them here to tune without code changes.
regime:
  long_strategy: ""
  short_strategy: ""
  adx_enter: 25.0              # ADX above this → trending
  adx_exit: 20.0               # ADX below this → range-bound
  adx_strong: 30.0             # fast-track confirmation (must be > adx_enter)
  confirm_sessions: 2          # consecutive sessions to confirm a regime change
  flip_pause_sessions: 5       # sessions to freeze after too many flips
  max_flips_in_window: 3       # max flips before pausing
  flip_window_sessions: 10     # sliding window for flip counting
  classify_interval: 3600      # bar interval (seconds) for classification
  # What to do in a range-bound regime when the technicals show a
  # directional bias (ema_slope + DI direction agree):
  #   sit_out    — never trade ranges on bias alone (default)
  #   short_half — bearish bias → short leg, half size
  #   long_half  — bullish bias → long leg, half size
  #   both_half  — either bias → matching leg, half size
  # Independent of this setting, external votes that meet the quorum
  # below and agree with the price drift deploy the matching leg at half
  # size.
  range_bias_action: sit_out
  # How many agreeing external votes (W2/W3/W4, one per source) it takes
  # to accelerate a regime confirmation or open a range-bound probe.
  # ASYMMETRIC on purpose: going long on external evidence is the
  # expensive mistake — W2, the loudest voter, is 3/10 right by the time
  # the nightly lane reads it — while confirming a DOWN read early is the
  # cheap, protective direction. Conflict-cancel is unchanged and
  # absolute: ANY opposing vote kills a range-bound probe, quorum or not.
  # 0 disables votes for that direction entirely.
  vote_quorum_up: 2
  vote_quorum_down: 1
  # Flip-pause / streak semantics. The defaults below are the CURRENT
  # rules; flip one to true only to restore the legacy behaviour.
  # true = a flip pause freezes everything (legacy). false = it freezes
  # trend ENTRIES only, so the engine can still exit to range-bound and
  # stop trading a dead trend.
  pause_freezes_exits: false
  # true = an exit to range-bound counts toward max_flips_in_window
  # (legacy). false = only trend entries count, so a calm spell can no
  # longer help arm a pause.
  exits_count_as_flips: false
  # true = a transitional (dead-zone ADX) session zeroes the confirmation
  # streak (legacy). false = it neither increments nor resets it.
  transitional_resets_streak: false
